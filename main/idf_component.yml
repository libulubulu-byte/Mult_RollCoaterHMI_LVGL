dependencies:
  # ESP-IDF 版本要求（规范：5.1 及以上；本工程在 5.5.1 上验证）
  idf:
    version: ">=5.1.0"

  # ---------------------------------------------------------------------------
  # LVGL 8.3.x
  # ---------------------------------------------------------------------------
  # 注意：esp_lvgl_port 自身的版本号是 2.x，它「同一份代码同时支持 LVGL8 与
  # LVGL9」，究竟用哪个大版本由这里对 lvgl 的约束决定：
  #   lvgl/lvgl: "~8.3.0"  -> 走 LVGL 8.3 分支（本工程）
  #   lvgl/lvgl: "^9"      -> 走 LVGL 9 分支
  # 所以「8.x 分支」是通过 lvgl 的约束选出来的，esp_lvgl_port 用 ^2。
  lvgl/lvgl:
    version: "~8.3.0"
    public: true

  espressif/esp_lvgl_port:
    version: "^2.0.0"
    public: true

  # ---------------------------------------------------------------------------
  # 触摸控制器驱动
  # ---------------------------------------------------------------------------
  # 默认只有 GT911。若把触摸切成 AXS15231（Kconfig: ROLLCOATER_TOUCH_AXS15231），
  # 需要额外引入对应的驱动组件（社区组件，按需打开下面两行并核对组件名）：
  #   esp_lcd_touch_axs15231b:
  #     version: "*"
  espressif/esp_lcd_touch_gt911:
    version: "^1"

  # ---------------------------------------------------------------------------
  # 输入设备（可选）：本工程 UI 全部走触摸 + 屏幕按键，无需物理按键。
  # 若后续要加急停实体按钮，可引入 espressif/button。
  # ---------------------------------------------------------------------------
